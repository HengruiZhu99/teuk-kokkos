specification:
  name: raw_org_spin_plus2_companion
  status: proposal_not_production_authority
  perturbation_expansion: "A=A0+epsilon*A1+epsilon^2*A2+... (no factorial)"
  signature: "+---"
  gauge: outgoing_radiation_gauge
  tetrad: rotated_kinnersley_gamma_zero
  evolved_second_order_variable: raw_fixed_tetrad_Psi0_coefficient
  paired_existing_variable: raw_fixed_tetrad_Psi4_coefficient
  warning: "Do not substitute the Spiers reduced psi0L source for this raw field"

prime_map:
  tetrad: "l<->n, m<->mbar"
  derivatives: "D<->Delta, delta<->bardelta"
  weyl: "Psi0<->Psi4, Psi1<->Psi3, Psi2->Psi2"
  spin_coefficients:
    kappa: "-nu"
    sigma: "-lambda"
    rho: "-mu"
    tau: "-pi"
    beta: "-alpha"
    epsilon: "-gamma"
  ghp_weight: "{p,q}->{-p,-q}"
  fourier_m: unchanged
  sharp: "separate operation X_m^sharp=conj(X_-m)"

regular_field:
  physical: Psi0
  internal: Z_plus
  spin: 2
  boost: 2
  scaling: "Psi0 = W_plus * Z_plus"
  W_plus: "R^5/(L^2-i*a*R*cos(theta))^4"
  scri: "finite Z_plus for Psi0=O(R^5)"
  horizon: "W_plus finite and nonzero for 0<R_H<infinity"

background_outer_operators:
  d4p: "D-4*rho-rhobar-3*epsilon+epsilonbar"
  d3p: "delta-3*beta-alphabar-4*tau+pibar"
  warning: "Do not drop epsilon terms unless D is explicitly replaced by the weighted GHP thorn on a stated type"

homogeneous_covariant_operator:
  expression: "(D-4*rho-rhobar-3*epsilon+epsilonbar)*(Delta-4*gamma+mu)-(delta-3*beta-alphabar-4*tau+pibar)*(bardelta-4*alpha+pi)-3*Psi2_0"
  field: Psi0

ungauge_fixed_source:
  equation: "O_plus[Psi0_2]=S0_2"
  terms:
    - id: u01
      expression: "-[d4p*A0_1-d3p*B0_1] Psi0_1"
    - id: u02
      expression: "+[d4p*C1_1-d3p*D1_1] Psi1_1"
    - id: u03
      expression: "+3[d4p*sigma_1-d3p*kappa_1] Psi2_1"
    - id: u04
      expression: "-3 Psi2_0[(d4p_1+3*rho_1)*sigma_1-(d3p_1+3*tau_1)*kappa_1]"
  operator_definitions:
    A0: "Delta-4*gamma+mu"
    B0: "bardelta-4*alpha+pi"
    C1: "delta-2*beta-4*tau"
    D1: "D-2*epsilon-4*rho"

org_specialization:
  zero: [Delta_1, gamma_1, mu_1, nu_1, A0_1]
  derivative_perturbations:
    D_1: "-(1/2)*h_ll*Delta"
    delta_1: "-h_lm*Delta+(1/2)*h_mm*bardelta"
    bardelta_1: "-h_lbar*Delta+(1/2)*h_barbar*delta"
  grouped_source:
    - "d4p[C1_1(Psi1_1)+3*sigma_1*Psi2_1]"
    - "d3p[B0_1(Psi0_1)-D1_1(Psi1_1)-3*kappa_1*Psi2_1]"
    - "-3*Psi2_0[(D_1-rho_1-rhobar_1-3*epsilon_1+epsilonbar_1)*sigma_1-(delta_1-3*beta_1-alphabar_1-tau_1+pibar_1)*kappa_1]"

required_inputs:
  - {name: Psi0_1, spin: 2, boost: 2, scri_power: 5, current: derived_missing}
  - {name: Psi1_1, spin: 1, boost: 1, scri_power: 4, current: derived_missing}
  - {name: Psi2_1, spin: 0, boost: 0, scri_power: 3, current: stored_H}
  - {name: sigma_1, spin: 2, boost: 1, scri_power: 2, current: derived_specified_not_implemented}
  - {name: kappa_1, spin: 1, boost: 2, scri_power: 3, current: derived_specified_not_implemented}
  - {name: rho_1, spin: 0, boost: 1, scri_power: 3, current: derived_specified_not_implemented}
  - {name: tau_1, spin: 1, boost: 0, scri_power: 2, current: derived_specified_not_implemented}
  - {name: pi_1, spin: -1, boost: 0, scri_power: 2, current: stored_Pi}

compact_raw_source:
  status: symbolically_verified_conditional_on_regular_Z0_Z1
  implementation: include/teuk/plus2_source.hpp
  integration_status: standalone_not_wired_to_runtime
  implementation_test: tests/test_plus2_source.cpp
  ledger: PLUS2_SOURCE_TERM_LEDGER.csv
  derivation: docs/PLUS2_SOURCE_COMPACTIFICATION.md
  stored_fields:
    - "Psi0=R^5*Z0; Z0=Z_plus/(L^2-i*a*R*cos(theta))^4; Psi1=R^4*Z1; Psi2_1=R^3*H"
    - "sigma1=R^2*Sig; kappa1=R^3*Kap"
    - "rho1=R^3*Rh; tau1=R^2*Ta; pi1=R^2*Pi; epsilon1=R^2*Ep"
    - "h_ll=R^2*V with V=U/mu0; h_lbar=R^2*C; h_lm=R^2*Csharp"
    - "h_barbar=R*B; h_mm=R*Bsharp"
  ordered_pair_families:
    C12: "R^-6*C1_1[Psi1]_12"
    B12: "R^-7*B0_1[Psi0]_12"
    D12: "R^-6*D1_1[Psi1]_12"
    Er12: "R^-4*Er_1[sigma]_12"
    Et12: "R^-5*Et_1[kappa]_12"
    J12: "R*C12+3*Sig1*H2"
    K12: "R*B12-D12-3*Kap1*H2"
    Q12: "Er12-R*Et12"
  outer: "S0/R^6=thorn_5(J)-(4*rho0+rhobar0)*J+R*eth_6(K)+R^2*(-4*tau0+pibar0)*K-3*R*psi20*Q"
  scri_result: "S0=O(R^6); coordinate forcing is O(R^3)"
  horizon_result: finite_for_RH_positive
  oracle: tools/symbolic/verify_plus2_compact_source.py

stage_local_bianchi_closure:
  status: standalone_route_a_implemented_not_runtime_wired
  authority: "arXiv:2008.11770 bianchi-5, bianchi-6, delta-1; vacuum ORG with gamma=0"
  delta5_Z0: "eth_4 Z1-R*mu0*Z0-4*R*tau0*Z1+3*Sig*H"
  delta4_Z1: "eth_3 H+R*(-2*mu0*Z1-3*tau0*H-Csharp*Delta_3 psi20+(1/2)*Bsharp*ethprime_3 psi20-3*Ta*psi20)"
  inversion: "X_T=[F-(R/L^2)*(R*X_R+n*X)]/(2+4*M*R/L^2)"
  time_order: "h[0..2] with Bianchi closure; naive local metric forcing value would require h[0..4]"
  production_value_contract: "J and K value+tangent; Q value only; final forcing value only"
  endpoint: "Z0/Z1 values require explicit qualified scri quotient coefficients; missing coefficients fail closed"
  implementation:
    - include/teuk/plus2_bianchi.hpp
    - include/teuk/plus2_source_value_spatial.hpp
  symbolic_test: tools/symbolic/verify_plus2_bianchi_closure.py

homogeneous_operator:
  authority: "arXiv:2010.00162 compact common s=+/-2 master equation"
  spin: 2
  principal_symbol: same_as_existing_minus2
  angular_eigenvalue: "-(ell-2)*(ell+3)"
  reuse_generic_kernel: mathematically_derived_but_not_numerically_qualified
  coordinate_source_normalization:
    general: "forcing_s=(2*Sigma_BL/R)*S_s"
    both_signs: "2*(L^4+a^2*R^2*cos(theta)^2)*S_s/R^3"
    scri_gate: "passed conditionally: regular Z0/Z1 imply S0=O(R^6) and finite forcing"

production_gate:
  enabled: false
  source_compactification_gate: passed
  blockers:
    - cancellation_safe_Psi0_Psi1_oracle
    - runtime_pipeline_common_stage_integration
    - gpu_and_convergence_validation
