# Development template: requires its own timestep and resolution study.
config_version = 1
mass = 1.0
spin = 0.999
compactification_length = 1.0
nr = 513
ntheta = 16
ellmax_first = 8
ellmax_second = 8
first_order_modes = -2,2
second_order_modes = -2,2
final_time = 500.0
steps = 200000
cfl = 0.05
reduction_damping = 0.1
dissipation = 0.005
reduction_mode = free_damped
initial_data.type = gaussian
