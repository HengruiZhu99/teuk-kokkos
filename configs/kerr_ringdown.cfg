# Development template: moderate-spin first-order Kerr ringdown.
config_version = 1
mass = 1.0
spin = 0.7
compactification_length = 2.0
nr = 257
ntheta = 10
ellmax_first = 6
ellmax_second = 6
first_order_modes = -2,2
second_order_modes = -2,2
final_time = 80.0
steps = 16000
cfl = 0.1
reduction_damping = 0.1
dissipation = 0.005
reduction_mode = free_damped
initial_data.type = gaussian
initial_data.seed_ell = 2
initial_data.seed_m = 2
initial_data.amplitude_real = 1.0e-4
initial_data.amplitude_imag = 0.0
initial_data.center = 0.65
initial_data.width = 0.08
initial_data.time_derivative = zero
initial_data.add_sharp_partner = false
second_order.enabled = false
output.directory = run-kerr-ringdown
output.diagnostic_every = 200
output.checkpoint_every = 2000
